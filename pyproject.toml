[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wfs"
version = "2.0.0"
description = "Terminal WiFi network scanner, identifier and security auditor (macOS)."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []
keywords = ["wifi", "network", "scanner", "security", "terminal"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
wfs = "wifi_cli:run_cli"

[tool.setuptools]
py-modules = ["wifi_cli", "identify", "store", "security", "config", "exporter"]
