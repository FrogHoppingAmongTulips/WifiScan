<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wfs</title>

<!--
  Отдельный файл для работы над внешним видом. Открывается двойным щелчком,
  сервер не нужен: данные ниже — образец, той же формы, что приходит от wfs.
  Когда вид устроит, содержимое переедет в web.py вместо PAGE, а DEMO
  заменится на запросы к /api/.
-->

<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;
  font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  -webkit-font-smoothing:antialiased}
main{max-width:820px;margin:0 auto;padding:28px 20px 60px}

h1{font-size:14px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;
  color:#666;margin:0 0 22px}

nav{display:flex;gap:20px;margin:0 0 26px}
nav button{background:none;border:0;padding:0;font:inherit;color:#666;cursor:pointer}
nav button.on,nav button:hover{color:#fff}

.row{border:0;background:none;width:100%;padding:9px 0;font:inherit;color:#fff;
  text-align:left;cursor:pointer;display:flex;gap:14px;align-items:baseline;
  border-bottom:1px solid #161616}
.row .k{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{color:#666;white-space:nowrap}
.row.on .v{color:#fff}

.det{display:none;padding:4px 0 16px;border-bottom:1px solid #161616}
.det.on{display:block}
.det div{display:flex;gap:14px;padding:3px 0}
.det .n{color:#666;width:150px;flex-shrink:0}

.empty,.note{color:#666;padding:10px 0}

@media(max-width:560px){
  main{padding:20px 14px 50px}
  .det .n{width:110px}
}
</style>

<main>
  <h1>wfs</h1>
  <nav>
    <button data-tab="devices" class="on">устройства</button>
    <button data-tab="out">исходящие</button>
  </nav>
  <div id="body"></div>
</main>

<script>
// Образец данных той же формы, что отдаёт wfs. Здесь его правят, чтобы
// посмотреть, как вид держит длинные имена, пустые поля и большие списки.
const DEMO = {
  devices: [
    {ip:'192.168.1.1',mac:'38:6B:1C:00:00:01',name:'MR50G AC1900 Wireless Dual Band Gigabit Router',
     vendor:'Arcadyan',type:'router',os_hint:'Linux',ports:[80,443,53],is_gateway:true,
     first_seen:'2026-07-02 11:04',last_seen:'2026-08-21 10:31'},
    {ip:'192.168.1.100',mac:'AE:E6:91:ED:5B:73',name:'MacBook Air',vendor:'Private/Randomized',
     type:'laptop',os_hint:'macOS',ports:[],is_me:true,random_mac:true,
     first_seen:'2026-07-02 11:04',last_seen:'2026-08-21 10:31'},
    {ip:'192.168.1.106',mac:'B2:41:0C:9A:77:14',name:'ooo.local',vendor:'Private/Randomized',
     type:'phone',os_hint:'',ports:[62078],random_mac:true,
     first_seen:'2026-08-19 21:12',last_seen:'2026-08-21 10:30'},
    {ip:'192.168.1.117',mac:'1C:53:F9:20:44:8E',name:'',vendor:'Amazon Technologies',
     type:'',os_hint:'Linux',ports:[8009,9000],
     first_seen:'2026-08-21 10:28',last_seen:'2026-08-21 10:31'},
  ],
  out: [
    {app:'Safari',ip:'17.253.144.10',port:443,rdns:'apple.com',country:'United States',org:'Apple Inc'},
    {app:'Termius',ip:'78.153.130.97',port:22,rdns:'',country:'Austria',org:'AEZA-ORG'},
    {app:'Shadowrocket',ip:'104.46.162.224',port:443,rdns:'',country:'',org:''},
  ],
};

let tab = 'devices', open = null;

const esc = s => String(s == null ? '' : s).replace(/[<>&"]/g,
  c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

function rows(list, key, val, detail){
  if(!list || !list.length) return '<div class="empty">пусто</div>';
  return list.map((it, i) => {
    const id = tab + i;
    const body = Object.entries(detail(it))
      .filter(([, v]) => v !== '' && v != null && !(Array.isArray(v) && !v.length))
      .map(([n, v]) => '<div><span class="n">' + esc(n) + '</span><span>' + esc(v) + '</span></div>')
      .join('');
    return '<button class="row' + (open === id ? ' on' : '') + '" data-id="' + id + '">' +
             '<span class="k">' + esc(key(it)) + '</span>' +
             '<span class="v">' + esc(val(it)) + '</span>' +
           '</button>' +
           '<div class="det' + (open === id ? ' on' : '') + '">' + body + '</div>';
  }).join('');
}

function render(){
  const b = document.getElementById('body');
  if(tab === 'devices'){
    b.innerHTML = rows(DEMO.devices, x => x.name || x.ip, x => x.ip, x => ({
      'адрес': x.ip, 'mac': x.mac, 'производитель': x.vendor, 'тип': x.type,
      'система': x.os_hint, 'порты': (x.ports || []).join(' '),
      'это шлюз': x.is_gateway ? 'да' : '', 'это я': x.is_me ? 'да' : '',
      'случайный mac': x.random_mac ? 'да' : '',
      'впервые замечен': x.first_seen, 'последний раз': x.last_seen,
    }));
  } else {
    b.innerHTML = rows(DEMO.out, x => x.app, x => x.country || x.rdns || x.ip, x => ({
      'программа': x.app, 'адрес': x.ip, 'порт': x.port,
      'имя сервера': x.rdns, 'страна': x.country, 'владелец': x.org,
    }));
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('nav button');
  if(t){
    tab = t.dataset.tab; open = null;
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b === t));
    return render();
  }
  const row = e.target.closest('.row');
  if(!row) return;
  open = (open === row.dataset.id) ? null : row.dataset.id;
  render();
});

render();
</script>
